<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>ONCOLAB CITO TIMER</title><style>:root{--card:#102744;--text:#f7fbff;--muted:#a9bfd7;--accent:#35b6ff;--good:#45d483;--warn:#ffc857}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#061326,#0b213b);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:720px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}header{text-align:center;margin-bottom:18px}.brand{font-size:13px;letter-spacing:.18em;color:var(--accent);font-weight:800}.title{font-size:27px;font-weight:850;margin:5px 0}.sub{color:var(--muted);font-size:14px}.card{background:rgba(16,39,68,.92);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:22px;box-shadow:0 18px 45px rgba(0,0,0,.25)}.step{text-align:center;color:var(--muted);font-weight:700}.name{text-align:center;font-size:30px;font-weight:850;margin:8px 0}.instruction{text-align:center;color:#d9e8f5;min-height:22px}.timer{text-align:center;font-variant-numeric:tabular-nums;font-size:76px;line-height:1;font-weight:900;margin:20px 0}.progress{height:10px;background:#07182b;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:var(--accent)}.count{text-align:center;font-size:44px;font-weight:850;margin:14px 0 0;display:none}.controls,.nav{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:18px}.nav{margin-top:11px}button{border:0;border-radius:16px;padding:16px 10px;font-size:16px;font-weight:800;background:#193756;color:white}.primary{background:var(--good);color:#062417}.pause{background:var(--warn);color:#302000}.danger{background:#402438;color:#ffdfe7}.status{text-align:center;margin-top:14px;color:var(--muted);font-size:13px}.protocol{margin-top:18px}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 4px;border-top:1px solid rgba(255,255,255,.08);font-size:14px}.row span:last-child{color:var(--muted);text-align:right}.active{color:var(--accent)!important;font-weight:800}@media(max-width:420px){.timer{font-size:64px}.name{font-size:26px}}</style></head><body><div class="wrap"><header><div class="brand">ONCOLAB</div><div class="title">CITO TIMER</div><div class="sub">Asistente manual de tinción de citología</div></header><div class="card"><div id="step" class="step">PASO 1 DE 9</div><div id="name" class="name">Alcohol 96 %</div><div id="instruction" class="instruction">Mantener las láminas durante 25 minutos</div><div id="timer" class="timer">25:00</div><div class="progress"><div id="bar" class="bar"></div></div><div id="count" class="count">Inmersión 0 / 10</div><div class="controls"><button id="start" class="primary">▶ INICIAR</button><button id="pause" class="pause">⏸ PAUSA</button></div><div class="nav"><button id="prev">← ANTERIOR</button><button id="next">SIGUIENTE →</button></div><button id="reset" class="danger" style="width:100%;margin-top:11px">↻ REINICIAR PASO</button><div id="status" class="status">Toca INICIAR para comenzar.</div></div><div class="card protocol"><h3>Protocolo cargado</h3><div id="list"></div></div></div><script>const protocol=[{name:"Alcohol 96 %",sec:1500,text:"Mantener las láminas durante 25 minutos"},{name:"Agua",sec:15,immersions:10,text:"Realizar 10 inmersiones siguiendo los sonidos"},{name:"Hematoxilina",sec:120,text:"Mantener durante 2 minutos"},{name:"Lavado",sec:15,immersions:10,text:"Realizar 10 inmersiones siguiendo los sonidos"},{name:"Alcohol",sec:120,text:"Mantener durante 2 minutos"},{name:"Eosina",sec:120,text:"Mantener durante 2 minutos"},{name:"Alcohol",sec:120,text:"Mantener durante 2 minutos"},{name:"Acetona",sec:15,immersions:10,text:"Realizar 10 inmersiones siguiendo los sonidos"},{name:"Xilol",sec:10,text:"Mantener durante 10 segundos"}];let idx=0,remaining=protocol[0].sec,running=false,startedAt=null,baseRemaining=remaining,raf=null,lastImm=0;const $=id=>document.getElementById(id),list=$("list");function fmt(s){s=Math.max(0,Math.ceil(s));return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}protocol.forEach((p,i)=>{let d=document.createElement("div");d.className="row";d.innerHTML=`<span>${i+1}. ${p.name}</span><span>${p.immersions?`10 inmersiones · ${p.sec} s`:fmt(p.sec)}</span>`;list.appendChild(d)});function beep(freq=880,dur=.16){try{const C=window.AudioContext||window.webkitAudioContext;window.ac=window.ac||new C();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freq;g.gain.value=.12;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.stop(ac.currentTime+dur)}catch(e){}}function render(){const p=protocol[idx];$("step").textContent=`PASO ${idx+1} DE ${protocol.length}`;$("name").textContent=p.name;$("instruction").textContent=p.text;$("timer").textContent=fmt(remaining);$("bar").style.width=`${Math.min(100,Math.max(0,(1-remaining/p.sec)*100))}%`;$("count").style.display=p.immersions?"block":"none";if(p.immersions){let done=Math.min(10,Math.floor((p.sec-remaining)/(p.sec/p.immersions)));$("count").textContent=`Inmersión ${done} / 10`}document.querySelectorAll(".row").forEach((r,i)=>r.firstChild.classList.toggle("active",i===idx))}function tick(){if(!running)return;remaining=Math.max(0,baseRemaining-(performance.now()-startedAt)/1000);const p=protocol[idx];if(p.immersions){let done=Math.min(10,Math.floor((p.sec-remaining)/(p.sec/p.immersions)));if(done>lastImm){lastImm=done;beep(1050,.1)}}render();if(remaining<=0){running=false;beep(660,.18);setTimeout(()=>beep(880,.18),220);setTimeout(()=>beep(1100,.3),440);$("status").textContent=idx===protocol.length-1?"✓ PROCESO COMPLETADO":"✓ Paso terminado. Pasa al siguiente reactivo.";return}raf=requestAnimationFrame(tick)}function start(){if(running)return;beep(700,.08);running=true;startedAt=performance.now();baseRemaining=remaining;$("status").textContent="Temporizador en curso…";raf=requestAnimationFrame(tick)}function pause(){if(!running)return;running=false;cancelAnimationFrame(raf);$("status").textContent="En pausa."}function load(i){pause();idx=Math.max(0,Math.min(protocol.length-1,i));remaining=protocol[idx].sec;baseRemaining=remaining;lastImm=0;$("status").textContent="Listo para iniciar este paso.";render()}$("start").onclick=start;$("pause").onclick=pause;$("prev").onclick=()=>load(idx-1);$("next").onclick=()=>load(idx+1);$("reset").onclick=()=>load(idx);render();</script></body></html>

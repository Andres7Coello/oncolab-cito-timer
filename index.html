<!doctype html><html lang="es"><head><link rel="apple-touch-icon" href="Cito%20Timer%20.PNG"><link rel="icon" type="image/png" href="Cito%20Timer%20.PNG"><meta name="apple-mobile-web-app-title" content="CITO TIMER"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>CITO TIMER</title><style>:root{--card:#102744;--text:#f7fbff;--muted:#a9bfd7;--accent:#35b6ff;--good:#45d483;--warn:#ffc857}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#061326,#0b213b);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:720px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}header{text-align:center;margin-bottom:18px}.brand{font-size:13px;letter-spacing:.18em;color:var(--accent);font-weight:800}.title{font-size:27px;font-weight:850;margin:5px 0}.sub,.status{color:var(--muted)}.mode{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#102744;border-radius:18px;padding:14px 16px;margin-bottom:14px}.switch{width:58px;height:34px;border-radius:20px;background:#29445f;padding:3px;border:0}.switch i{display:block;width:28px;height:28px;border-radius:50%;background:white;transition:.2s}.switch.on{background:var(--good)}.switch.on i{transform:translateX(24px)}.card{background:rgba(16,39,68,.94);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:22px}.step{text-align:center;color:var(--muted);font-weight:700}.name{text-align:center;font-size:30px;font-weight:850;margin:8px 0}.instruction{text-align:center;color:#d9e8f5;min-height:22px}.timer{text-align:center;font-variant-numeric:tabular-nums;font-size:76px;line-height:1;font-weight:900;margin:20px 0}.progress{height:10px;background:#07182b;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--accent);width:0}.count{text-align:center;font-size:42px;font-weight:850;margin:14px 0 0;display:none}.transition{text-align:center;display:none;margin:14px 0}.transition .big{font-size:90px;font-weight:900}.transition .next{font-size:22px;font-weight:800}.controls,.nav{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:18px}.nav{margin-top:11px}button{border:0;border-radius:16px;padding:16px 10px;font-size:16px;font-weight:800;background:#193756;color:white}.primary{background:var(--good);color:#062417}.pause{background:var(--warn);color:#302000}.danger{background:#402438;color:#ffdfe7}.status{text-align:center;margin-top:14px;font-size:13px}.protocol{margin-top:18px}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 4px;border-top:1px solid rgba(255,255,255,.08);font-size:14px}.row span:last-child{color:var(--muted);text-align:right}.active{color:var(--accent)!important;font-weight:800}@media(max-width:420px){.timer{font-size:64px}.name{font-size:26px}}</style></head><body><div class="wrap"><header><div class="brand">ONCOLAB</div><div class="title">CITO TIMER</div><div class="sub">Asistente manual de tinción de citología</div></header><div class="mode"><div><b>🧤 MODO AUTOMÁTICO</b><div class="sub">Manos libres · transición sonora 3–2–1</div></div><button id="auto" class="switch" aria-label="Modo automático"><i></i></button></div><div class="card"><div id="step" class="step"></div><div id="name" class="name"></div><div id="instruction" class="instruction"></div><div id="normal"><div id="timer" class="timer"></div><div class="progress"><div id="bar" class="bar"></div></div><div id="count" class="count"></div></div><div id="transition" class="transition"><div>PASAR A</div><div id="nextName" class="next"></div><div id="big" class="big">3</div><div>Prepárate…</div></div><div class="controls"><button id="start" class="primary">▶ INICIAR</button><button id="pause" class="pause">⏸ PAUSA</button></div><div class="nav"><button id="prev">← ANTERIOR</button><button id="next">SIGUIENTE →</button></div><button id="reset" class="danger" style="width:100%;margin-top:11px">↻ REINICIAR PASO</button><div id="status" class="status">Toca INICIAR para comenzar.</div></div><div class="card protocol"><h3>Protocolo cargado</h3><div id="list"></div></div></div><script>const P=[{name:'Alcohol 96 %',sec:1500,text:'Mantener las láminas durante 25 minutos'},{name:'Agua',sec:15,imm:10,text:'10 inmersiones siguiendo los sonidos'},{name:'Hematoxilina',sec:120,text:'Mantener durante 2 minutos'},{name:'Lavado',sec:15,imm:10,text:'10 inmersiones siguiendo los sonidos'},{name:'Alcohol',sec:120,text:'Mantener durante 2 minutos'},{name:'Eosina',sec:120,text:'Mantener durante 2 minutos'},{name:'Alcohol',sec:120,text:'Mantener durante 2 minutos'},{name:'Acetona',sec:15,imm:10,text:'10 inmersiones siguiendo los sonidos'},{name:'Xilol',sec:10,text:'Mantener durante 10 segundos'}];let idx=0,rem=P[0].sec,running=false,auto=false,startAt=0,base=rem,raf,lastImm=0,transitioning=false;const $=x=>document.getElementById(x);function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}P.forEach((p,i)=>{let d=document.createElement('div');d.className='row';d.innerHTML=`<span>${i+1}. ${p.name}</span><span>${p.imm?'10 inmersiones · 15 s':fmt(p.sec)}</span>`;$('list').appendChild(d)});function tone(f=900,d=.13){try{const C=window.AudioContext||window.webkitAudioContext;window.ac=window.ac||new C();if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.16;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}function render(){let p=P[idx];$('step').textContent=`PASO ${idx+1} DE ${P.length}`;$('name').textContent=p.name;$('instruction').textContent=p.text;$('timer').textContent=fmt(rem);$('bar').style.width=Math.min(100,Math.max(0,(1-rem/p.sec)*100))+'%';$('count').style.display=p.imm?'block':'none';if(p.imm){let n=Math.min(10,Math.floor((p.sec-rem)/(p.sec/p.imm)));$('count').textContent=`Inmersión ${n} / 10`}document.querySelectorAll('.row').forEach((r,i)=>r.firstChild.classList.toggle('active',i===idx))}function begin(){if(running||transitioning)return;tone(700,.08);running=true;startAt=performance.now();base=rem;$('status').textContent=auto?'🧤 Automático en curso…':'Temporizador en curso…';raf=requestAnimationFrame(tick)}function tick(){if(!running)return;rem=Math.max(0,base-(performance.now()-startAt)/1000);let p=P[idx];if(p.imm){let n=Math.min(10,Math.floor((p.sec-rem)/(p.sec/p.imm)));if(n>lastImm){lastImm=n;tone(1100,.12)}}render();if(rem<=0){running=false;finish();return}raf=requestAnimationFrame(tick)}function finish(){tone(650,.18);setTimeout(()=>tone(900,.18),220);setTimeout(()=>tone(1150,.28),440);if(idx===P.length-1){$('status').textContent='✓ TINCIÓN COMPLETADA';return}if(auto)setTimeout(()=>transition(),800);else $('status').textContent='✓ Paso terminado. Pasa al siguiente reactivo.'}function transition(){transitioning=true;let next=P[idx+1];$('normal').style.display='none';$('transition').style.display='block';$('nextName').textContent=next.name;$('status').textContent='Cambia las láminas al siguiente reactivo';let n=3;$('big').textContent=n;tone(750,.18);let t=setInterval(()=>{n--;if(n>0){$('big').textContent=n;tone(750,.18)}else{clearInterval(t);$('big').textContent='¡YA!';tone(1200,.35);setTimeout(()=>{idx++;rem=P[idx].sec;base=rem;lastImm=0;transitioning=false;$('normal').style.display='block';$('transition').style.display='none';render();begin()},650)}},1000)}function pause(){if(!running)return;running=false;cancelAnimationFrame(raf);$('status').textContent='En pausa.'}function load(i){running=false;cancelAnimationFrame(raf);transitioning=false;idx=Math.max(0,Math.min(P.length-1,i));rem=P[idx].sec;base=rem;lastImm=0;$('normal').style.display='block';$('transition').style.display='none';$('status').textContent='Listo para iniciar este paso.';render()}$('auto').addEventListener('click',()=>{auto=!auto;$('auto').classList.toggle('on',auto);tone(auto?1000:600,.1);$('status').textContent=auto?'🧤 Modo automático activado. Toca INICIAR una vez.':'Modo manual activado.'});$('start').addEventListener('click',begin);$('pause').addEventListener('click',pause);$('prev').addEventListener('click',()=>load(idx-1));$('next').addEventListener('click',()=>load(idx+1));$('reset').addEventListener('click',()=>load(idx));render();</script></body></html>
